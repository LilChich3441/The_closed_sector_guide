<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE CLOSED SECTOR // Гайд</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&family=Saira+Semi+Condensed:wght@600;700&display=swap');
:root{
  --bg:#16140f;--bg2:#100e0a;--panel:#221f17;--panel2:#2e2a1f;--line:#423b2c;--line2:#5a513c;
  --txt:#f0e9d8;--dim:#a89a7d;--acid:#e8b84b;--acid2:#c9982f;--hot:#ff7a45;--gold:#ffd24a;--steel:#8fc4a8;
  --r1:#a89a7d;--r2:#8fc4a8;--r3:#c79ae0;--r4:#ffd24a;--r5:#ff7a45;
  --glow:rgba(232,184,75,.35);
  --cut:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'Saira',system-ui,sans-serif;min-height:100vh;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(232,184,75,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,184,75,.02) 1px,transparent 1px),
    radial-gradient(circle at 88% -8%,rgba(232,184,75,.12),transparent 46%),
    radial-gradient(circle at 0% 100%,rgba(143,196,168,.06),transparent 44%);
  background-size:48px 48px,48px 48px,100% 100%,100% 100%;
  padding:0 0 80px;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
header{padding:24px 18px 18px;position:relative;overflow:hidden;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(232,184,75,.04),transparent)}
header::before{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:repeating-linear-gradient(90deg,var(--acid) 0 22px,transparent 22px 34px);opacity:.55}
header::after{content:'';position:absolute;top:14px;right:18px;width:64px;height:64px;
  border:1px solid var(--line2);border-radius:50%;opacity:.25;
  background:repeating-conic-gradient(from 0deg,var(--line2) 0 1deg,transparent 1deg 30deg);
  pointer-events:none}
.hgrid{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.crest{width:46px;height:54px;flex:none;background:var(--acid);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-family:'Saira Condensed',sans-serif;
  font-weight:700;font-size:26px;letter-spacing:-1px;
  clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);box-shadow:0 0 20px rgba(232,184,75,.3)}
h1{font-family:'Saira Condensed',sans-serif;font-size:38px;font-weight:700;letter-spacing:2px;
  color:var(--txt);line-height:.92;text-transform:uppercase}
h1 b{display:block;font-size:12px;letter-spacing:7px;color:var(--acid);font-weight:600;margin-top:5px}
.tagline{color:var(--dim);font-size:12px;letter-spacing:.5px;margin-left:auto;max-width:330px;text-align:right;line-height:1.5;
  border-left:2px solid var(--line2);padding-left:14px}
.search-wrap{max-width:1240px;margin:18px auto 0;padding:0 18px;position:relative}
#globalSearch{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-family:inherit;
  font-size:14px;padding:13px 16px 13px 40px;letter-spacing:.4px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
#globalSearch::placeholder{color:var(--dim)}
#globalSearch:focus{outline:none;border-color:var(--acid);box-shadow:0 0 0 1px var(--acid),0 0 24px rgba(232,184,75,.14)}
.search-wrap::before{content:'⌖';position:absolute;left:30px;top:50%;transform:translateY(-50%);color:var(--acid);font-size:16px;pointer-events:none}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin:20px auto 0;max-width:1240px;padding:8px 18px 0;
  position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--bg) 70%,transparent);
  backdrop-filter:blur(6px)}
.tab{background:var(--panel);border:1px solid var(--line);border-bottom:2px solid transparent;color:var(--dim);
  padding:12px 22px;cursor:pointer;font-family:'Saira Condensed',sans-serif;font-size:15px;letter-spacing:1.5px;
  font-weight:600;text-transform:uppercase;transition:.18s;position:relative}
.tab:hover{color:var(--txt);background:var(--panel2)}
.tab.on{background:var(--panel2);color:var(--acid);border-bottom-color:var(--acid)}
.tab.on::after{content:'';position:absolute;top:6px;right:8px;width:5px;height:5px;background:var(--acid);border-radius:50%;box-shadow:0 0 8px var(--acid)}
main{max-width:1240px;margin:0 auto;padding:0 18px}
section{display:none;animation:fade .25s}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 14px}
.filter{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:8px 15px;
  cursor:pointer;font-family:'Saira Condensed',sans-serif;font-size:13px;letter-spacing:1px;font-weight:600;
  transition:.15s;text-transform:uppercase;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.filter:hover{color:var(--txt);border-color:var(--line2);background:var(--panel2)}
.filter.on{background:var(--acid);color:var(--bg);border-color:var(--acid);font-weight:700}
.cnt{margin-left:auto;color:var(--dim);font-size:12px;letter-spacing:1px;font-family:'Saira Condensed',sans-serif;text-transform:uppercase}
.intro{color:var(--dim);font-size:13.5px;line-height:1.7;margin:18px 0;max-width:780px;
  border-left:2px solid var(--acid2);padding-left:14px}
.intro b{color:var(--acid)}
/* item grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px}
.card{background:var(--panel);border:1px solid var(--line);border-left-width:3px;padding:14px 15px;transition:transform .18s cubic-bezier(.2,.7,.3,1),border-color .18s,box-shadow .18s;position:relative;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.card::after{content:'';position:absolute;right:0;bottom:0;width:12px;height:12px;
  background:var(--line);clip-path:polygon(100% 0,100% 100%,0 100%)}
.card:hover{border-color:var(--acid);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px var(--acid)}
.card.rr1{border-left-color:var(--r1)}.card.rr2{border-left-color:var(--r2)}.card.rr3{border-left-color:var(--r3)}
.card.rr4{border-left-color:var(--r4)}.card.rr5{border-left-color:var(--r5)}
.card.rr1 .statline{border-left-color:var(--r1)}.card.rr2 .statline{border-left-color:var(--r2)}
.card.rr3 .statline{border-left-color:var(--r3)}.card.rr4 .statline{border-left-color:var(--r4)}.card.rr5 .statline{border-left-color:var(--r5)}
.cname{font-family:'Saira Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.3px;color:var(--txt);margin-bottom:10px;line-height:1.05}
.statline{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:var(--bg2);
  border-left:3px solid var(--line2);padding:6px 12px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
.bignum{font-family:'Saira Condensed',sans-serif;font-size:38px;font-weight:700;line-height:.9;text-shadow:0 0 18px rgba(0,0,0,.4)}
.bignum.dmg{color:var(--hot)}.bignum.arm{color:var(--steel)}.bignum.spd{color:var(--acid)}
.statlbl{font-size:11px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;font-family:'Saira Condensed',sans-serif}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:9.5px;padding:3px 8px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;white-space:nowrap;
  font-family:'Saira Condensed',sans-serif;border:1px solid transparent}
.chip.rar1{background:rgba(154,160,124,.14);color:var(--r1);border-color:rgba(154,160,124,.3)}
.chip.rar2{background:rgba(143,196,168,.14);color:var(--r2);border-color:rgba(143,196,168,.3)}
.chip.rar3{background:rgba(179,154,208,.14);color:var(--r3);border-color:rgba(179,154,208,.3)}
.chip.rar4{background:rgba(232,184,75,.14);color:var(--r4);border-color:rgba(232,184,75,.32)}
.chip.rar5{background:rgba(255,122,69,.16);color:var(--r5);border-color:rgba(255,122,69,.34)}
.chip.norep{background:rgba(255,122,69,.13);color:var(--hot);border-color:rgba(255,122,69,.3)}
.chip.craft{background:rgba(232,184,75,.13);color:var(--acid);border-color:rgba(232,184,75,.3)}
.chip.boss{background:rgba(232,184,75,.14);color:var(--gold);border-color:rgba(232,184,75,.3)}
.chip.set{background:rgba(179,154,208,.12);color:var(--r3);border-color:rgba(179,154,208,.26)}
.chip.mat{background:var(--panel2);color:var(--dim);border-color:var(--line)}
.note{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5;font-style:italic}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line)}
.tbl th{background:var(--panel2);color:var(--acid);text-align:left;padding:11px 14px;font-family:'Saira Condensed',sans-serif;
  letter-spacing:1.2px;text-transform:uppercase;font-size:12px;font-weight:600;border-bottom:2px solid var(--line2)}
.tbl td{padding:11px 14px;border-bottom:1px solid #21282a;vertical-align:top}
.tbl tbody tr{transition:.1s}
.tbl tr:hover td{background:rgba(232,184,75,.05)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tname{font-family:'Saira Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.3px;color:var(--txt)}
.dotr{display:inline-block;width:8px;height:8px;margin-right:8px;vertical-align:middle;transform:rotate(45deg)}
.d1{background:var(--r1)}.d2{background:var(--r2)}.d3{background:var(--r3)}.d4{background:var(--r4)}.d5{background:var(--r5)}
.danger{color:var(--hot);font-weight:700}
.safe{color:var(--acid)}
.gold{color:var(--gold)}
.muted{color:var(--dim)}
/* quests */
.quest{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden}
.qhead{background:var(--panel2);padding:13px 16px;font-family:'Saira Condensed',sans-serif;font-size:20px;letter-spacing:2px;
  color:var(--acid);text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.qhead .qn{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:1px}
.qstage{padding:11px 16px;border-bottom:1px solid #21282a;display:flex;gap:14px;flex-wrap:wrap}
.qstage:last-child{border-bottom:none}
.qloc{font-family:'Saira Condensed',sans-serif;letter-spacing:1px;color:var(--gold);min-width:160px;font-size:14px;padding-top:2px}
.qtargets{display:flex;flex-direction:column;gap:4px;flex:1}
.qt{font-size:12px;color:var(--txt);padding-left:16px;position:relative}
.qt::before{content:'›';position:absolute;left:2px;color:var(--acid2)}
.qt .role{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
/* ranks/progress columns */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:780px){.cols{grid-template-columns:1fr}.tagline{display:none}.bignum{font-size:24px}}
h2.sec{font-family:'Saira Condensed',sans-serif;font-size:15px;letter-spacing:3px;color:var(--acid);text-transform:uppercase;margin:8px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.legend{font-size:10.5px;color:var(--dim);margin:14px 0;line-height:1.8}
.legend .chip{display:inline-block;margin:0 2px}
.hidden{display:none!important}
/* repair calculator */
.calc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acid);margin:0 0 18px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.calc-head{background:var(--panel2);padding:11px 16px;font-family:'Saira Condensed',sans-serif;font-size:17px;
  font-weight:600;letter-spacing:1.5px;color:var(--acid);text-transform:uppercase;border-bottom:1px solid var(--line)}
.calc-body{padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.calc-field{display:flex;flex-direction:column;gap:6px}
.calc-field label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-family:'Saira Condensed',sans-serif;font-weight:600}
.calc-field .gsel{min-width:220px}
.cinput{background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-family:'Saira Condensed',sans-serif;
  font-size:18px;font-weight:600;padding:7px 12px;width:110px;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.cinput:focus{outline:none;border-color:var(--acid)}
.calc-out{margin-left:auto;text-align:right;min-width:200px}
.cbig{font-family:'Saira Condensed',sans-serif;font-size:38px;font-weight:700;color:var(--acid);line-height:1}
.cbig span{font-size:16px;color:var(--dim);font-weight:600}
.csub{font-size:13px;color:var(--txt);margin-top:4px}
.csub.muted{color:var(--dim);font-size:12px}
.csub b{color:var(--acid)}
.cresult.ok{font-size:15px;color:var(--steel);font-family:'Saira Condensed',sans-serif;font-weight:600}
@media(max-width:680px){.calc-body{flex-direction:column;align-items:stretch}.calc-out{margin-left:0;text-align:left}.calc-field .gsel,.cinput{width:100%}}
/* story quests */
.gsel{background:var(--panel);border:1px solid var(--line);color:var(--txt);font-family:'Saira Condensed',sans-serif;font-size:13px;
  padding:8px 13px;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;font-weight:600;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.gsel:focus{outline:none;border-color:var(--acid)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:11px}
.qcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);padding:14px;display:flex;gap:14px;position:relative;transition:.15s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.qcard:hover{border-left-color:var(--acid);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.qcard.isopt{border-left-style:dashed;opacity:.94}
.qleft{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:72px}
.qface{width:72px;height:72px;object-fit:cover;background:var(--bg2);border:1px solid var(--line2);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.qface.ph{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:30px;font-family:'Saira Condensed',sans-serif}
.qgiver{font-size:12px;color:var(--steel);letter-spacing:.5px;text-align:center;line-height:1.2;font-family:'Saira Condensed',sans-serif;font-weight:600;text-transform:uppercase}
.qbody{flex:1;min-width:0}
.qnum{position:absolute;top:10px;right:13px;font-family:'Saira Condensed',sans-serif;font-size:15px;color:var(--dim);letter-spacing:1px;font-weight:700}
.qtitle{font-family:'Saira Condensed',sans-serif;font-size:21px;font-weight:600;letter-spacing:.5px;color:var(--txt);line-height:1.08;margin-bottom:9px;padding-right:34px}
.qreq,.qrew{font-size:14px;margin-bottom:5px;line-height:1.45;display:flex;align-items:center;gap:8px}
.qicon{width:34px;height:34px;object-fit:cover;background:var(--bg2);border:1px solid var(--line);flex:none}
.ql{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-right:5px;font-family:'Saira Condensed',sans-serif;font-weight:600}
.qreq{color:var(--txt)}
.qrew{color:var(--acid)}
.qnote{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55;font-style:italic;border-top:1px solid #21282a;padding-top:7px}
.chip.giver{background:rgba(143,196,168,.14);color:var(--steel)}
.chip.opt{background:rgba(232,184,75,.13);color:var(--gold)}
.chip.unlock{background:rgba(232,184,75,.14);color:var(--acid)}
/* guides */
.guide-doc{max-width:840px;margin:14px auto 0}
.ghdr{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.gtag{display:inline-block;background:var(--acid);color:var(--bg);font-family:'Saira Condensed',sans-serif;font-size:12px;
  font-weight:700;letter-spacing:2px;padding:4px 12px;margin-bottom:10px;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.gtitle{font-family:'Saira Condensed',sans-serif;font-size:32px;font-weight:700;letter-spacing:.5px;color:var(--txt);line-height:1.03;text-transform:uppercase}
.gsub{color:var(--dim);font-size:13px;margin-top:6px;letter-spacing:.5px}
.gp{font-size:15px;line-height:1.7;color:var(--txt);margin:14px 0}
.gp b{color:var(--acid)}
.gp.gwarn{border-left:3px solid var(--hot);padding:10px 14px;background:rgba(255,91,58,.06);color:var(--txt);font-size:14px;margin:16px 0}
.gp.gwarn b{color:var(--hot)}
.gh{font-family:'Saira Condensed',sans-serif;font-size:20px;letter-spacing:1px;color:var(--acid);margin:26px 0 12px;
  text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:7px}
.grules{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.grule{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:13px 15px;font-size:15px;line-height:1.4}
.grule b{color:var(--acid)}
.grn{font-family:'Saira Condensed',sans-serif;font-size:22px;font-weight:700;color:#0a0c08;background:var(--acid);
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.gimg{margin:16px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#070905}
.gimg img{width:100%;display:block}
.gimg.quote{max-width:520px}
.grow2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
.gimg.sm{margin:0;display:flex;flex-direction:column}
.gimg.sm img{width:100%}
.gimg.sm span{font-size:11px;color:var(--dim);padding:8px 10px;line-height:1.4;border-top:1px solid var(--line)}
.gspecs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.gspec{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:16px;text-align:center}
.gsn{font-family:'Saira Condensed',sans-serif;font-size:42px;font-weight:700;color:var(--acid);line-height:1}
.gsl{font-size:13px;color:var(--txt);margin-top:8px;font-family:'Saira Condensed',sans-serif;letter-spacing:.5px}
.gsl span{display:block;color:var(--dim);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:0}
.gcards{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.gmech{background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-left-color:var(--acid2);border-radius:5px;padding:16px}
.gmh{font-family:'Saira Condensed',sans-serif;font-size:19px;letter-spacing:1.5px;color:var(--acid);text-transform:uppercase;margin-bottom:8px}
.gmech p{font-size:14px;line-height:1.65;color:var(--txt)}
.gmech p b{color:var(--gold)}
.gformula{margin-top:12px;background:#070905;border:1px dashed var(--line);border-radius:4px;padding:10px 14px;
  font-size:14px;color:var(--acid);text-align:center;letter-spacing:.5px}
.gsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gok,.gbad{font-size:12.5px;line-height:1.5;padding:11px 13px;border-radius:4px}
.gok{background:rgba(232,184,75,.08);border:1px solid var(--acid2);color:var(--txt)}
.gok b{color:var(--acid)}
.gbad{background:rgba(255,91,58,.07);border:1px solid var(--hot);color:var(--txt)}
.gbad b{color:var(--hot)}
@media(max-width:640px){.gspecs{grid-template-columns:1fr}.gsplit{grid-template-columns:1fr}.gtitle{font-size:24px}}
/* UX polish */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--acid2)}
html{scrollbar-color:var(--line2) var(--bg2)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,.filter:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
.tab,.filter,.gsel{-webkit-tap-highlight-color:transparent}
#toTop{position:fixed;right:20px;bottom:20px;z-index:80;width:46px;height:46px;border:none;cursor:pointer;
  background:var(--acid);color:var(--bg);font-size:20px;font-weight:700;display:none;align-items:center;justify-content:center;
  clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);box-shadow:0 4px 16px rgba(0,0,0,.5);transition:.15s}
#toTop:hover{background:var(--txt)}
#toTop.show{display:flex}
/* ===== LOCATIONS + LOOT ===== */
.loclist{display:flex;flex-direction:column;gap:10px}
.loccard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acid2);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.locrow{display:flex;align-items:center;gap:16px;padding:14px 16px;flex-wrap:wrap;transition:background .15s}
.locrow:hover{background:var(--panel2)}
.locname{font-family:'Saira Condensed',sans-serif;font-size:21px;font-weight:700;letter-spacing:.5px;color:var(--txt);display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
.locarrow{color:var(--acid);font-size:13px;transition:transform .2s;display:inline-block;width:14px}
.locarrow.dim{color:var(--line2)}
.loctag{font-family:'Saira',sans-serif;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--bg);background:var(--acid);padding:3px 9px;border-radius:20px;margin-left:4px}
.locstats{display:flex;gap:18px;flex-wrap:wrap}
.lst{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.lst b{font-family:'Saira Condensed',sans-serif;font-size:22px;font-weight:700}
.lst i{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-style:normal;margin-top:2px}
.locloot{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 16px}
.locloot.open{max-height:6000px;padding:6px 16px 18px}
.lootsec{font-family:'Saira Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--acid);margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lootgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lootitem{display:flex;gap:10px;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--line2);padding:9px 10px}
.lootitem.rr1{border-left-color:var(--r1)}.lootitem.rr2{border-left-color:var(--r2)}.lootitem.rr3{border-left-color:var(--r3)}
.lootitem.rr4{border-left-color:var(--r4)}.lootitem.rr5{border-left-color:var(--r5)}
.looticon{width:48px;height:48px;object-fit:cover;background:var(--bg);border:1px solid var(--line);flex:none}
.lootbody{flex:1;min-width:0}
.lootname{font-family:'Saira Condensed',sans-serif;font-size:15px;font-weight:600;color:var(--txt);line-height:1.1;margin-bottom:4px}
.lstat{font-size:11px;color:var(--dim);margin-bottom:4px}
.lstat b{font-family:'Saira Condensed',sans-serif;font-size:16px;color:var(--hot)}
.lootitem .chips{margin-top:3px}
.lootdesc{font-size:10.5px;color:var(--dim);line-height:1.4;margin-top:5px}
.bossblk{margin:16px 0 4px;border:1px solid var(--line);border-left:3px solid var(--r5);background:rgba(255,122,69,.05);padding:12px 14px}
.bosshd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bosstitle{font-family:'Saira Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--hot)}
.bosstitle .lbl{font-size:11px;color:var(--dim);letter-spacing:1.5px;margin-right:6px}
.bossst{display:flex;gap:16px;margin-left:auto}
.bossst .s b{font-family:'Saira Condensed',sans-serif;font-size:18px;font-weight:700}
.bossst .s i{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-style:normal;margin-left:5px}
.bosstext{font-size:11px;color:var(--dim);line-height:1.5;margin:6px 0}
.bosstext b{color:var(--txt);font-weight:600}
.bossdrop{font-family:'Saira Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--r5);margin:12px 0 8px}
/* ===== MOBILE ===== */
@media(max-width:860px){
  .tagline{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    padding:8px 12px 0;scroll-snap-type:x proximity}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;scroll-snap-align:start}
}
@media(max-width:680px){
  .wrap,main,.tabs,.search-wrap,header .hgrid{padding-left:14px;padding-right:14px}
  h1{font-size:30px;letter-spacing:1px}
  h1 b{font-size:11px;letter-spacing:5px}
  .crest{width:40px;height:48px;font-size:22px}
  .tab{padding:12px 16px;font-size:14px}
  .grid{grid-template-columns:1fr;gap:10px}
  .qgrid{grid-template-columns:1fr}
  .bignum{font-size:34px}
  /* responsive tables → stacked cards */
  .tbl,.tbl thead,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl{border:none;background:transparent}
  .tbl thead{display:none}
  .tbl tr{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);
    margin-bottom:10px;padding:10px 12px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
  .tbl tr:hover td{background:transparent}
  .tbl td{border:none;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  .tbl td::before{content:attr(data-label);color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:1px;font-family:'Saira Condensed',sans-serif;font-weight:600;text-align:left;flex:none}
  .tbl td.tname{font-size:18px;padding:2px 0 8px;border-bottom:1px solid var(--line);margin-bottom:6px;justify-content:flex-start}
  .tbl td.tname::before{display:none}
  .tbl td.num{justify-content:space-between}
  .tbl .bignum{font-size:24px!important}
  .locname{font-size:18px;min-width:140px}
  .locstats{gap:12px}
  .lst b{font-size:18px}
  .lootgrid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .hgrid{gap:12px}
  .gspecs{grid-template-columns:1fr}
  .gsplit{grid-template-columns:1fr}
  .gtitle{font-size:24px}
  .qcard{flex-direction:column}
  .qleft{flex-direction:row;width:auto;gap:10px;align-items:center}
  .qface{width:54px;height:54px}
  .qtitle{font-size:19px}
  #globalSearch{font-size:16px}
  .calc-body{flex-direction:column;align-items:stretch}
  .calc-out{margin-left:0;text-align:left;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  .calc-field .gsel,.cinput{width:100%}
  #toTop{right:14px;bottom:14px;width:52px;height:52px}
}
footer{text-align:center;color:var(--dim);font-size:11px;letter-spacing:2px;margin-top:48px;padding-top:18px;
  text-transform:uppercase;font-family:'Saira Condensed',sans-serif;
  border-top:1px solid var(--line);max-width:1240px;margin-left:auto;margin-right:auto;padding-left:18px;padding-right:18px}
</style>
</head>
<body>
<header>
  <div class="hgrid">
    <div class="crest">CS</div>
    <h1>The Closed Sector<b>полевой справочник</b></h1>
    <div class="tagline">Снаряжение, локации и контракты закрытого сектора. Данные из таблицы сообщества.</div>
  </div>
</header>
<div class="search-wrap">
  <input id="globalSearch" placeholder="◂ Глобальный поиск: оружие, броня, цель контракта, локация..." oninput="globalSearch(this.value)">
</div>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<footer>THE CLOSED SECTOR — фанатский справочник • данные могут меняться с патчами</footer>
<button id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Наверх">▲</button>
<script src="images.js"></script>
<script src="data.js"></script>
<script>
const RARN={1:'Обычное',2:'Редкое',3:'Мистическое',4:'Легендарное',5:'Мифическое'};
const $=s=>document.querySelector(s);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return (n||0).toLocaleString('ru-RU');}
function img(k){return (k&&typeof IMG!=='undefined'&&IMG[k])?IMG[k]:'';}

let activeTab='gear';
let gearFilter={cat:'weapons',rar:0};

const TABS=[
  {id:'gear',label:'Снаряжение'},
  {id:'cars',label:'Транспорт'},
  {id:'story',label:'Задания'},
  {id:'quests',label:'Контракты'},
  {id:'locations',label:'Локации и лут'},
  {id:'guides',label:'Гайды'},
  {id:'progress',label:'Опыт / Звания'},
];
let storyFilter={chap:1,giver:'',opt:false};

function buildTabs(){
  $('#tabs').innerHTML=TABS.map(t=>
    `<div class="tab ${t.id===activeTab?'on':''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.label}</div>`).join('');
}
function switchTab(id){activeTab=id;buildTabs();render();window.scrollTo({top:0,behavior:'smooth'});}

// ---------- GEAR ----------
function gearItems(){
  if(gearFilter.cat==='weapons')return DB.weapons.map(x=>({...x,kind:'dmg',klbl:'Урон'}));
  if(gearFilter.cat==='armor')return DB.armor.map(x=>({...x,kind:'arm',klbl:'Броня'}));
  if(gearFilter.cat==='helmets')return DB.helmets.map(x=>({...x,kind:'arm',klbl:'Защита'}));
  return [];
}
function gearCard(it){
  const norep=/Не ремонт/i.test(it.mat);
  const chips=[];
  chips.push(`<span class="chip rar${it.rar}">${RARN[it.rar]||it.rarName}</span>`);
  if(norep)chips.push(`<span class="chip norep">не чинится</span>`);
  else if(it.mat)chips.push(`<span class="chip mat">починка ${esc(it.mat)} мат.</span>`);
  if(it.craft)chips.push(`<span class="chip craft">крафт ${esc(it.craft.replace(/[()]/g,''))}</span>`);
  if(/[Бб]осс/.test(it.note))chips.push(`<span class="chip boss">${esc(it.note)}</span>`);
  if(it.set)chips.push(`<span class="chip set">${esc(it.set)}</span>`);
  let extra='';
  if(it.note && !/[Бб]осс/.test(it.note))extra=`<div class="note">${esc(it.note)}</div>`;
  return `<div class="card rr${it.rar}" data-name="${esc(it.name.toLowerCase())}">
    <div class="cname">${esc(it.name)}</div>
    <div class="statline"><span class="bignum ${it.kind}">${esc(it.stat)||'—'}</span><span class="statlbl">${it.klbl}</span></div>
    <div class="chips">${chips.join('')}</div>${extra}
  </div>`;
}
function renderGear(){
  const cats=[['weapons','Оружие',DB.weapons.length],['armor','Броня',DB.armor.length],['helmets','Шлемы',DB.helmets.length]];
  const rars=[[0,'Все'],[5,'Мифическое'],[4,'Легендарное'],[3,'Мистическое'],[2,'Редкое'],[1,'Обычное']];
  let items=gearItems();
  if(gearFilter.rar)items=items.filter(x=>x.rar===gearFilter.rar);
  // sort by stat desc
  items.sort((a,b)=>(parseInt(b.stat)||0)-(parseInt(a.stat)||0));
  return `
  <div class="intro">Снаряжение отсортировано по силе. <b>Чем выше редкость — тем мощнее</b>, но «не чинится» означает одноразовый предмет (боссовый или ивентовый). Крафт указывает, на каком уровне мастерской предмет можно скрафтить.</div>
  <div class="bar">
    ${cats.map(c=>`<button class="filter ${gearFilter.cat===c[0]?'on':''}" onclick="setGearCat('${c[0]}')">${c[1]} <span class="muted">${c[2]}</span></button>`).join('')}
    <span style="width:14px"></span>
    ${rars.map(r=>`<button class="filter ${gearFilter.rar===r[0]?'on':''}" onclick="setGearRar(${r[0]})">${r[1]}</button>`).join('')}
    <span class="cnt" id="gearCnt"></span>
  </div>
  <div class="grid" id="gearGrid">${items.map(gearCard).join('')}</div>
  <div class="legend">
    Редкость: <span class="chip rar1">Обычное</span><span class="chip rar2">Редкое</span><span class="chip rar3">Мистическое</span><span class="chip rar4">Легендарное</span><span class="chip rar5">Мифическое</span>
    &nbsp;•&nbsp; <span class="chip norep">не чинится</span> — одноразовый предмет
  </div>`;
}
function setGearCat(c){gearFilter.cat=c;render();}
function setGearRar(r){gearFilter.rar=r;render();}

// ---------- CARS ----------
function cargoLabel(c){
  const map={'машины':'🚛 машины','большие грузы':'▣ большие','малые грузы':'▪ малые','ничего':'— ничего'};
  return map[c]||c;
}
function renderCars(){
  const rows=DB.cars.slice().sort((a,b)=>(parseInt(b.speed)||0)-(parseInt(a.speed)||0)).map(c=>{
    const cost=c.repCost?`${esc(c.repCost)} мат/1%`:'<span class="muted">нет данных</span>';
    const rep=c.repairable?cost:'<span class="danger">не чинится</span>';
    const spp=c.spp?esc(c.spp)+'%':'<span class="muted">?</span>';
    return `<tr data-name="${esc(c.name.toLowerCase())}">
      <td class="tname"><span class="dotr d${c.rar}"></span>${esc(c.name)}</td>
      <td class="num" data-label="Скорость"><span class="bignum spd" style="font-size:20px">${esc(c.speed)}</span></td>
      <td class="num" data-label="СПП">${spp}</td>
      <td data-label="Тип груза">${cargoLabel(c.cargo)}</td>
      <td class="num" data-label="Починка">${rep}</td>
    </tr>`;
  }).join('');
  return `
  <div class="intro"><b>Скорость</b> — насколько быстрее проходит рейд. <b>СПП</b> — средняя потеря прочности за рейд (чем меньше, тем реже чинить). <b>Тип</b> — что машина возит из рейда. Последний столбец — стоимость починки за 1% прочности.</div>

  <div class="calc">
    <div class="calc-head">▣ Калькулятор починки</div>
    <div class="calc-body">
      <div class="calc-field">
        <label>Машина</label>
        <select class="gsel" id="calcCar" onchange="runCalc()">
          ${DB.cars.filter(c=>c.repairable&&c.repCost).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="calc-field">
        <label>Текущая прочность, %</label>
        <input class="cinput" id="calcCur" type="number" min="0" max="100" value="50" oninput="runCalc()">
      </div>
      <div class="calc-out" id="calcOut"></div>
    </div>
  </div>

  <table class="tbl">
    <thead><tr><th>Машина</th><th class="num">Скорость</th><th class="num">СПП</th><th>Тип груза</th><th class="num">Починка</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="legend">
    Редкость: <span class="chip rar1">Обычный</span><span class="chip rar2">Редкий</span><span class="chip rar3">Мистический</span><span class="chip rar4">Легендарный</span><span class="chip rar5">Мифический</span>
    &nbsp;•&nbsp; Тип груза: 🚛 эвакуатор возит машины · ▣ большие грузы · ▪ малые грузы · — не возит ничего
  </div>`;
}
function runCalc(){
  const car=DB.cars.find(c=>c.name===document.getElementById('calcCar').value);
  if(!car){return;}
  let cur=parseFloat(document.getElementById('calcCur').value);
  if(isNaN(cur))cur=0;
  cur=Math.max(0,Math.min(100,cur));
  const per=parseFloat(car.repCost)||0;
  const diff=Math.max(0,100-cur);
  const total=Math.round(diff*per);
  const out=document.getElementById('calcOut');
  const spp=car.spp?parseFloat(car.spp):0;
  let raidsLine='';
  if(spp>0){
    const full=Math.floor(100/spp);
    const now=Math.floor(cur/spp);
    raidsLine=`<div class="csub muted">Хватает на <b>${full}</b> рейд(ов) со 100% · сейчас осталось <b>${now}</b> (теряет ~${esc(car.spp)}% за рейд)</div>`;
  }
  if(diff<=0){
    out.innerHTML=`<div class="cresult ok">Чинить не нужно — прочность 100%.</div>${raidsLine}`;
    return;
  }
  out.innerHTML=`
    <div class="cbig">${fmt(total)} <span>мат.</span></div>
    <div class="csub">восстановить <b>${diff}%</b> × ${per} мат = <b>${fmt(total)}</b> материалов</div>
    ${raidsLine}`;
}

// ---------- LOCATIONS ----------
function lootCard(it){
  const chips=[];
  if(it.rar)chips.push(`<span class="chip rar${it.rar}">${RARN[it.rar]||''}</span>`);
  if(it.heavy)chips.push(`<span class="chip norep">нужна машина</span>`);
  const stat=it.stat?`<div class="lstat"><b>${esc(it.stat)}</b> <span>${esc(it.statlbl)}</span></div>`:'';
  return `<div class="lootitem rr${it.rar||1}">
    <img class="looticon" src="${img(it.icon)}" alt="" loading="lazy">
    <div class="lootbody">
      <div class="lootname">${esc(it.name)}</div>
      ${stat}
      <div class="chips">${chips.join('')}</div>
      ${it.desc?`<div class="lootdesc">${esc(it.desc)}</div>`:''}
    </div>
  </div>`;
}
function renderLocations(){
  const cards=DB.locations.map((l,idx)=>{
    const data=DB.locLoot&&DB.locLoot[l.name];
    const hasLoot=!!data;
    const head=`
      <div class="locrow" ${hasLoot?`onclick="toggleLoc(${idx})"`:''} ${hasLoot?'style="cursor:pointer"':''}>
        <div class="locname">${hasLoot?'<span class="locarrow" id="arr'+idx+'">▶</span>':'<span class="locarrow dim">·</span>'}${esc(l.name)}
          ${hasLoot?'<span class="loctag">нажми — лут</span>':''}</div>
        <div class="locstats">
          <span class="lst"><b class="danger">${esc(l.atk)}</b><i>атака</i></span>
          <span class="lst"><b class="safe">${esc(l['def'])}</b><i>защита</i></span>
          <span class="lst"><b class="muted">${esc(l.footA||'—')}</b><i>пешком</i></span>
          <span class="lst"><b class="gold">${esc(l.car||'—')}</b><i>авто</i></span>
        </div>
      </div>`;
    let body='';
    if(hasLoot){
      const b=data.boss;
      const bossBlk=b?`<div class="bossblk">
        <div class="bosshd">
          <div class="bosstitle"><span class="lbl">БОСС</span>${esc(b.name)}</div>
          <div class="bossst">
            <span class="s"><b class="danger">${esc(b.atk)}</b><i>атака</i></span>
            <span class="s"><b class="safe">${esc(b['def'])}</b><i>защита</i></span>
          </div>
        </div>
        ${b.cond?`<div class="bosstext">${esc(b.cond)}</div>`:''}
        ${b.fight?`<div class="bosstext">${esc(b.fight)}</div>`:''}
        ${b.drop&&b.drop.length?`<div class="bossdrop">Добыча с босса</div>
        <div class="lootgrid">${b.drop.map(lootCard).join('')}</div>`:''}
      </div>`:'';
      body=`<div class="locloot" id="loot${idx}">
        <div class="lootsec">Рекомендуемое снаряжение в рейд</div>
        <div class="lootgrid">${data.rec.map(lootCard).join('')}</div>
        ${bossBlk}
        <div class="lootsec">Что можно найти на локации</div>
        <div class="lootgrid">${data.loot.map(lootCard).join('')}</div>
      </div>`;
    }
    return `<div class="loccard" data-name="${esc(l.name.toLowerCase())}">${head}${body}</div>`;
  }).join('');
  const brows=DB.bosses.map(b=>`<tr data-name="${esc(b.name.toLowerCase())}">
    <td class="tname"><span class="dotr d5"></span>${esc(b.name)}</td>
    <td class="num danger" data-label="Мин. атака">${esc(b.atk)}</td>
    <td class="num safe" data-label="Мин. защита">${esc(b['def'])}</td>
  </tr>`).join('');
  return `
  <div class="intro">Минимальные <b class="danger">атака</b> и <b class="safe">защита</b> отряда для входа. Защита = «броня + запас HP/стимулятор». Время рейда дано для <b>взрослого бойца (25–40 лет)</b>. <b class="gold">Нажми на локацию</b>, где есть пометка «лут» — раскроется список снаряжения и добычи.</div>
  <div class="loclist">${cards}</div>
  <h2 class="sec" style="margin-top:26px">Боссы</h2>
  <div class="intro" style="margin-top:0">У боссов характеристики не учитывают стимуляторы — нужна чистая броня и урон.</div>
  <table class="tbl" style="max-width:560px">
    <thead><tr><th>Босс</th><th class="num">Мин. атака</th><th class="num">Мин. защита</th></tr></thead>
    <tbody>${brows}</tbody>
  </table>`;
}
function toggleLoc(idx){
  const el=document.getElementById('loot'+idx);
  const arr=document.getElementById('arr'+idx);
  if(!el)return;
  const open=el.classList.toggle('open');
  if(arr)arr.textContent=open?'▼':'▶';
}

// ---------- QUESTS ----------
function roleSplit(t){
  const m=t.match(/^(Небольшой долг|Большой долг|Огромный долг|Адепт|Ментор|Преемник|Лейтенант|Капитан|Полковник|Специалист|Менеджер|Супервайзер)\s+(.*)$/);
  if(m)return `<span class="role">${m[1]}</span>${esc(m[2])}`;
  return esc(t);
}
function renderQuests(){
  return `
  <div class="intro">Контракты на ликвидацию проходят по локациям по нарастающей. Каждая цель — отдельный NPC, которого нужно устранить. Чем дальше локация, тем выше требования к отряду (см. «Локации»).</div>
  ${DB.quests.map(q=>{
    const total=q.stages.reduce((s,st)=>s+st.targets.length,0);
    return `<div class="quest" data-name="${esc((q.name+' '+q.stages.map(s=>s.targets.join(' ')).join(' ')).toLowerCase())}">
      <div class="qhead">⌖ ${esc(q.name)}<span class="qn">${total} целей</span></div>
      ${q.stages.map(st=>`<div class="qstage">
        <div class="qloc">${esc(st.loc)}</div>
        <div class="qtargets">${st.targets.map(t=>`<div class="qt">${roleSplit(t)}</div>`).join('')}</div>
      </div>`).join('')}
    </div>`;
  }).join('')}`;
}

// ---------- STORY QUESTS ----------
function normGiver(g){return g==='лидер фракции'?'Лидер фракции':g;}
function renderStory(){
  const all=DB.story.map(q=>({...q,giver:normGiver(q.giver)}));
  const givers=[...new Set(all.map(q=>q.giver).filter(Boolean))].sort();
  let list=all.filter(q=>q.chap===storyFilter.chap);
  if(storyFilter.giver)list=list.filter(q=>q.giver===storyFilter.giver);
  if(storyFilter.opt)list=list.filter(q=>q.optional);
  const ch1n=all.filter(q=>q.chap===1).length, ch2n=all.filter(q=>q.chap===2).length, ch3n=all.filter(q=>q.chap===3).length;
  const cards=list.map(q=>{
    const chips=[];
    if(q.optional)chips.push(`<span class="chip opt">необязательный</span>`);
    if(q.unlock)chips.push(`<span class="chip unlock">★ ${esc(q.unlock)}</span>`);
    const face=q.face?`<img class="qface" src="${img(q.face)}" alt="">`:`<div class="qface ph">?</div>`;
    const icon=q.icon?`<img class="qicon" src="${img(q.icon)}" alt="">`:'';
    const rew=q.reward?`<div class="qrew"><span class="ql">Награда</span> ${esc(q.reward)}</div>`:`<div class="qrew muted"><span class="ql">Награда</span> —</div>`;
    const note=q.note?`<div class="qnote">${esc(q.note)}</div>`:'';
    return `<div class="qcard ${q.optional?'isopt':''}" data-name="${esc((q.num+' '+q.title+' '+q.giver+' '+q.req+' '+q.reward).toLowerCase())}">
      <div class="qleft">
        ${face}
        <div class="qgiver">${esc(q.giver)||'—'}</div>
      </div>
      <div class="qbody">
        <div class="qnum">${esc(q.num)}</div>
        <div class="qtitle">${esc(q.title)}</div>
        <div class="qreq">${icon}<div><span class="ql">Сдать</span> ${esc(q.req)||'—'}</div></div>
        ${rew}
        <div class="chips">${chips.join('')}</div>
        ${note}
      </div>
    </div>`;
  }).join('');
  const incomplete = storyFilter.chap===3 ? `<div class="gp gwarn" style="margin:0 0 14px">⚠ Глава 3 ещё не завершена — статья дополняется, квесты будут добавляться.</div>` : '';
  return `
  <div class="intro">Основная цепочка заданий по порядку. <b>Сдать</b> — что нужно принести квестодателю, <b>Награда</b> — что получишь. Звёздочкой ★ отмечены квесты, открывающие важные механики (рынок, лагерь, организация). Иконка показывает нужный предмет.</div>
  <div class="bar">
    <button class="filter ${storyFilter.chap===1?'on':''}" onclick="setStoryChap(1)">Глава 1 <span class="muted">${ch1n}</span></button>
    <button class="filter ${storyFilter.chap===2?'on':''}" onclick="setStoryChap(2)">Глава 2 <span class="muted">${ch2n}</span></button>
    <button class="filter ${storyFilter.chap===3?'on':''}" onclick="setStoryChap(3)">Глава 3 <span class="muted">${ch3n}</span></button>
    <span style="width:14px"></span>
    <select class="gsel" onchange="setStoryGiver(this.value)">
      <option value="">Все квестодатели</option>
      ${givers.map(g=>`<option value="${esc(g)}" ${storyFilter.giver===g?'selected':''}>${esc(g)}</option>`).join('')}
    </select>
    <button class="filter ${storyFilter.opt?'on':''}" onclick="toggleStoryOpt()">Только необязательные</button>
    <span class="cnt">${list.length} заданий</span>
  </div>
  ${incomplete}
  <div class="qgrid">${cards}</div>`;
}
function setStoryChap(c){storyFilter.chap=c;render();}
function setStoryGiver(g){storyFilter.giver=g;render();}
function toggleStoryOpt(){storyFilter.opt=!storyFilter.opt;render();}

// ---------- GUIDES ----------
function renderGuides(){
  const gi=DB.guides[0].images;
  const rec=img(gi.rec),rifle=img(gi.rifle),helmet=img(gi.helmet),armor=img(gi.armor),creator=img(gi.creator);
  return `
  <div class="guide-doc" data-name="как ходить по локациям экипировка урон броня атака">
    <div class="ghdr">
      <div class="gtag">ГАЙД</div>
      <h2 class="gtitle">Как правильно ходить по локациям</h2>
      <div class="gsub">База: как читать экипировку и за что отвечают урон, броня и атака</div>
    </div>

    <p class="gp">Сегодня затрагиваем базу — как правильно ходить по локациям Кастовска. Запоминаем <b>два правила</b>:</p>
    <div class="grules">
      <div class="grule"><span class="grn">1</span> Отправляем бойцов с <b>не менее 100 HP</b>.</div>
      <div class="grule"><span class="grn">2</span> Следим за <b>рекомендованной экипировкой</b> локации.</div>
    </div>
    <p class="gp gwarn">Если отправили в Кварталы или Центр Кастовска с неполным HP, ВПК и стартовой бронёй — не удивляемся, что боец оттуда не вернулся.</p>

    <h3 class="gh">Учимся читать рекомендуемую экипировку</h3>
    <div class="gimg"><img src="${rec}" alt="Рекомендуемое снаряжение"></div>
    <p class="gp">Эта панель означает три требования:</p>
    <div class="gspecs">
      <div class="gspec"><div class="gsn">100</div><div class="gsl">аптечка<br><span>минимум HP</span></div></div>
      <div class="gspec"><div class="gsn">144</div><div class="gsl">винтовка<br><span>минимум урона</span></div></div>
      <div class="gspec"><div class="gsn">25</div><div class="gsl">шлем + броня<br><span>минимум брони</span></div></div>
    </div>
    <div class="grow2">
      <div class="gimg sm"><img src="${rifle}" alt="Винтовка СВП"></div>
      <div class="gimg sm"><img src="${helmet}" alt="Шлем пилота"></div>
      <div class="gimg sm"><img src="${armor}" alt="Байкал 2"></div>
    </div>
    <p class="gp gwarn">Локации коварные: с экипировкой ниже рекомендованной обычно прилетает 30–40 урона, но однажды боец может словить <b>&gt;100 урона</b> и не вернуться.</p>
    <p class="gp">В рюкзаки кладём <b>гранаты и стимуляторы</b> — расходники повышают атаку и броню. Не пренебрегаем ими: если экипировки не хватает, ими можно догнать до нужных показателей. Но они не навсегда — теряются в бою, если показателей не хватило.</p>

    <h3 class="gh">За что отвечают урон, броня и атака</h3>
    <div class="gcards">
      <div class="gmech">
        <div class="gmh">Урон локации</div>
        <p>Считается по рекомендованной экипировке. Если указана аптечка 150 и броня+шлем на 90 — то <b>100% урона локации ≈ 240</b>. Но это не потолок: локация может выдать и больше (см. «Атака»).</p>
        <div class="gformula">аптечка + (броня + шлем) ≈ 100% урона</div>
      </div>
      <div class="gmech">
        <div class="gmh">Броня</div>
        <p>Это <b>дополнительное здоровье</b>: 100 HP + 25 брони = фактически 125 HP. Но броня принимает <b>не весь</b> урон — 300 брони не значит, что 250 урона пройдут бесследно. Если боец вернулся с 1 HP — его вытянула только броня, больше так не отправляй, приодень бедолагу. Броню добивает <b>стимулятор</b> (тратится, если брони не хватило).</p>
      </div>
      <div class="gmech">
        <div class="gmh">Атака</div>
        <p>Показатель оружия. У каждой локации своё требование. Если в заметках лесника оружие на 144 и граната на 21 — снаряжаемся <b>хотя бы на 165 атаки</b>.</p>
        <div class="gsplit">
          <div class="gok"><b>Требование соблюдено</b> → урон не выше 100% (обычно 0–30%)</div>
          <div class="gbad"><b>Не соблюдено</b> → локация бьёт сверх 100% (30–120%)</div>
        </div>
      </div>
    </div>

    <h3 class="gh">…ну или как сказал сам создатель игры</h3>
    <div class="gimg quote"><img src="${creator}" alt="Сообщение создателя"></div>
  </div>`;
}

// ---------- PROGRESS ----------
function renderProgress(){
  const ranks=DB.ranks.map(r=>`<tr data-name="${esc(r.rank.toLowerCase())}">
    <td class="tname" style="font-size:13px">${esc(r.rank)}</td>
    <td class="num gold" data-label="Сум. опыт">${esc(r.exp)||'0'}</td>
    <td class="num muted" data-label="Скиллы">${esc(r.skill)}</td>
  </tr>`).join('');
  const season=DB.season.filter(s=>s.xp).map(s=>`<tr data-name="${esc(s.lv.toLowerCase())}">
    <td class="tname" style="font-size:14px">${esc(s.lv)}</td><td class="num gold" data-label="Требуемый опыт">${esc(s.xp)}</td>
  </tr>`).join('');
  return `
  <div class="intro">Слева — <b>звания исполнителей</b> (суммарный опыт и доступный уровень скиллов). Справа — <b>прогресс боевого пропуска сезона</b>: сколько опыта нужно на следующий уровень.</div>
  <div class="cols">
    <div>
      <h2 class="sec">Звания исполнителей</h2>
      <table class="tbl"><thead><tr><th>Звание</th><th class="num">Сум. опыт</th><th class="num">Скиллы</th></tr></thead><tbody>${ranks}</tbody></table>
    </div>
    <div>
      <h2 class="sec">Боевой пропуск (сезон)</h2>
      <table class="tbl"><thead><tr><th>Уровень</th><th class="num">Требуемый опыт</th></tr></thead><tbody>${season}</tbody></table>
    </div>
  </div>`;
}

function render(){
  const m=$('#main');
  if(activeTab==='gear')m.innerHTML=`<section class="on">${renderGear()}</section>`;
  else if(activeTab==='story')m.innerHTML=`<section class="on">${renderStory()}</section>`;
  else if(activeTab==='cars'){m.innerHTML=`<section class="on">${renderCars()}</section>`;runCalc();}
  else if(activeTab==='locations')m.innerHTML=`<section class="on">${renderLocations()}</section>`;
  else if(activeTab==='quests')m.innerHTML=`<section class="on">${renderQuests()}</section>`;
  else if(activeTab==='guides')m.innerHTML=`<section class="on">${renderGuides()}</section>`;
  else if(activeTab==='progress')m.innerHTML=`<section class="on">${renderProgress()}</section>`;
  const gs=$('#globalSearch').value.trim();
  if(gs)globalSearch(gs);
}

// ---------- GLOBAL SEARCH ----------
function globalSearch(q){
  q=q.trim().toLowerCase();
  const nodes=document.querySelectorAll('[data-name]');
  if(!q){nodes.forEach(n=>n.classList.remove('hidden'));return;}
  nodes.forEach(n=>{
    n.classList.toggle('hidden',!n.dataset.name.includes(q));
  });
}

buildTabs();render();
window.addEventListener('scroll',()=>{
  const b=document.getElementById('toTop');
  if(b)b.classList.toggle('show',window.scrollY>400);
});
</script>
</body>
</html>
