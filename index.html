<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE CLOSED SECTOR // Гайд</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&family=Saira+Semi+Condensed:wght@600;700&display=swap');
:root{
  --bg:#16140f;--bg2:#100e0a;--panel:#221f17;--panel2:#2e2a1f;--line:#423b2c;--line2:#5a513c;
  --txt:#f0e9d8;--dim:#a89a7d;--acid:#e8b84b;--acid2:#c9982f;--hot:#ff7a45;--gold:#ffd24a;--steel:#8fc4a8;
  --r1:#a89a7d;--r2:#8fc4a8;--r3:#c79ae0;--r4:#ffd24a;--r5:#ff7a45;
  --glow:rgba(232,184,75,.35);
  --cut:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'Saira',system-ui,sans-serif;min-height:100vh;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(232,184,75,.013) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,184,75,.013) 1px,transparent 1px),
    radial-gradient(circle at 85% -5%,rgba(232,184,75,.09),transparent 50%),
    radial-gradient(circle at 5% 100%,rgba(143,196,168,.05),transparent 45%);
  background-size:64px 64px,64px 64px,100% 100%,100% 100%;
  padding:0 0 80px;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
header{padding:24px 18px 20px;position:relative;overflow:hidden;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(232,184,75,.06),transparent);
  box-shadow:0 4px 20px rgba(0,0,0,.3)}
header::before{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:repeating-linear-gradient(90deg,var(--acid) 0 22px,transparent 22px 34px);opacity:.55}
header::after{content:'';position:absolute;top:14px;right:18px;width:64px;height:64px;
  border:1px solid var(--line2);border-radius:50%;opacity:.25;
  background:repeating-conic-gradient(from 0deg,var(--line2) 0 1deg,transparent 1deg 30deg);
  pointer-events:none}
.hgrid{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.crest{width:46px;height:54px;flex:none;background:var(--acid);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-family:'Saira Condensed',sans-serif;
  font-weight:700;font-size:26px;letter-spacing:-1px;
  clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);box-shadow:0 0 20px rgba(232,184,75,.3)}
h1{font-family:'Saira Condensed',sans-serif;font-size:38px;font-weight:700;letter-spacing:2px;
  color:var(--txt);line-height:.92;text-transform:uppercase}
h1 b{display:block;font-size:12px;letter-spacing:7px;color:var(--acid);font-weight:600;margin-top:5px}
.tagline{color:var(--dim);font-size:12px;letter-spacing:.5px;margin-left:auto;max-width:330px;text-align:right;line-height:1.5;
  border-left:2px solid var(--line2);padding-left:14px}
.search-wrap{max-width:1240px;margin:18px auto 0;padding:0 18px;position:relative}
#globalSearch{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-family:inherit;
  font-size:14px;padding:13px 16px 13px 42px;letter-spacing:.4px;border-radius:8px}
#globalSearch::placeholder{color:var(--dim)}
#globalSearch:focus{outline:none;border-color:var(--acid);box-shadow:0 0 0 1px var(--acid),0 0 24px rgba(232,184,75,.14)}
.search-wrap::before{content:'⌖';position:absolute;left:30px;top:50%;transform:translateY(-50%);color:var(--acid);font-size:16px;pointer-events:none}
.tabs{display:flex;gap:0;flex-wrap:wrap;margin:20px auto 0;max-width:1240px;padding:0 18px;
  position:sticky;top:0;z-index:50;background:var(--bg);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim);
  padding:12px 16px;cursor:pointer;font-family:'Saira Condensed',sans-serif;font-size:13px;letter-spacing:.8px;
  font-weight:600;text-transform:uppercase;transition:.18s;position:relative;border-radius:0;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--txt);background:rgba(232,184,75,.05)}
.tab.on{color:var(--acid);border-bottom-color:var(--acid);background:rgba(232,184,75,.06)}
.tab.on::after{display:none}
main{max-width:1240px;margin:0 auto;padding:20px 18px 0}
section{display:none;animation:fade .25s}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:16px 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.filter{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:7px 16px;
  cursor:pointer;font-family:'Saira Condensed',sans-serif;font-size:13px;letter-spacing:.8px;font-weight:600;
  transition:.18s;text-transform:uppercase;border-radius:20px}
.filter:hover{color:var(--txt);border-color:var(--line2);background:var(--panel2)}
.filter.on{background:var(--acid);color:var(--bg);border-color:var(--acid);font-weight:700;box-shadow:0 0 16px rgba(232,184,75,.28)}
.cnt{margin-left:auto;color:var(--dim);font-size:12px;letter-spacing:1px;font-family:'Saira Condensed',sans-serif;text-transform:uppercase}
.intro{color:var(--dim);font-size:13.5px;line-height:1.7;margin:18px 0;max-width:780px;
  border-left:2px solid var(--acid2);padding:10px 14px;background:rgba(232,184,75,.03);border-radius:0 6px 6px 0}
.intro b{color:var(--acid)}
/* item grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-left-width:3px;padding:14px 15px;transition:transform .18s cubic-bezier(.2,.7,.3,1),border-color .18s,box-shadow .18s;position:relative;border-radius:6px}
.card:hover{border-color:var(--acid);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.6),0 0 0 1px var(--acid),0 0 24px rgba(232,184,75,.1)}
.card.rr1{border-left-color:var(--r1)}.card.rr2{border-left-color:var(--r2)}.card.rr3{border-left-color:var(--r3)}
.card.rr4{border-left-color:var(--r4)}.card.rr5{border-left-color:var(--r5)}
.card.rr1 .statline{border-left-color:var(--r1)}.card.rr2 .statline{border-left-color:var(--r2)}
.card.rr3 .statline{border-left-color:var(--r3)}.card.rr4 .statline{border-left-color:var(--r4)}.card.rr5 .statline{border-left-color:var(--r5)}
.cname{font-family:'Saira Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.3px;color:var(--txt);margin-bottom:10px;line-height:1.05}
.cnamerow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cnamerow .cname{margin-bottom:0}
.gicon{width:44px;height:44px;flex:none;object-fit:cover;background:var(--bg);border:1px solid var(--line);border-radius:3px}
.statline{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:var(--bg2);
  border-left:3px solid var(--line2);padding:6px 12px;border-radius:0 4px 4px 0}
.bignum{font-family:'Saira Condensed',sans-serif;font-size:38px;font-weight:700;line-height:.9;text-shadow:0 0 18px rgba(0,0,0,.4)}
.bignum.dmg{color:var(--hot)}.bignum.arm{color:var(--steel)}.bignum.spd{color:var(--acid)}
.statlbl{font-size:11px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;font-family:'Saira Condensed',sans-serif}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:9.5px;padding:3px 8px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;white-space:nowrap;
  font-family:'Saira Condensed',sans-serif;border:1px solid transparent}
.chip.rar1{background:rgba(154,160,124,.14);color:var(--r1);border-color:rgba(154,160,124,.3)}
.chip.rar2{background:rgba(143,196,168,.14);color:var(--r2);border-color:rgba(143,196,168,.3)}
.chip.rar3{background:rgba(179,154,208,.14);color:var(--r3);border-color:rgba(179,154,208,.3)}
.chip.rar4{background:rgba(232,184,75,.14);color:var(--r4);border-color:rgba(232,184,75,.32)}
.chip.rar5{background:rgba(255,122,69,.16);color:var(--r5);border-color:rgba(255,122,69,.34)}
.chip.norep{background:rgba(255,122,69,.13);color:var(--hot);border-color:rgba(255,122,69,.3)}
.chip.craft{background:rgba(232,184,75,.13);color:var(--acid);border-color:rgba(232,184,75,.3)}
.chip.boss{background:rgba(232,184,75,.14);color:var(--gold);border-color:rgba(232,184,75,.3)}
.chip.set{background:rgba(179,154,208,.12);color:var(--r3);border-color:rgba(179,154,208,.26)}
/* D.I.S.S. sets */
.setrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.setbox{border:1px solid var(--line);border-top:3px solid var(--r3);background:var(--panel);padding:11px 12px 13px;border-radius:8px}
.setbox.rr4{border-top-color:var(--r4)}.setbox.rr5{border-top-color:var(--r5)}
.sethead{display:flex;align-items:center;gap:8px;font-family:'Saira Condensed',sans-serif;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--txt);font-weight:600;margin-bottom:10px}
.setrar{margin-left:auto}
.setbox .grid{grid-template-columns:1fr;gap:8px}
.chip.mat{background:var(--panel2);color:var(--dim);border-color:var(--line)}
.note{font-size:14.5px;color:var(--dim);margin-top:8px;line-height:1.55;font-style:italic}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line)}
.tbl th{background:var(--panel2);color:var(--acid);text-align:left;padding:12px 16px;font-family:'Saira Condensed',sans-serif;
  letter-spacing:1.2px;text-transform:uppercase;font-size:11px;font-weight:700;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 16px;border-bottom:1px solid rgba(66,59,44,.5);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.1s}
.tbl tr:hover td{background:rgba(232,184,75,.04)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tname{font-family:'Saira Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.3px;color:var(--txt)}
.carname{display:flex;align-items:center;gap:10px}
.carico{width:38px;height:38px;object-fit:cover;background:var(--bg);border:1px solid var(--line);border-radius:3px;flex:none}
.carico.ph{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 4px,var(--panel2) 4px,var(--panel2) 8px);opacity:.4}
.dotr{display:inline-block;width:8px;height:8px;margin-right:8px;vertical-align:middle;transform:rotate(45deg)}
.d1{background:var(--r1)}.d2{background:var(--r2)}.d3{background:var(--r3)}.d4{background:var(--r4)}.d5{background:var(--r5)}
.danger{color:var(--hot);font-weight:700}
.safe{color:var(--acid)}
.gold{color:var(--gold)}
.muted{color:var(--dim)}
/* quests */
.quest{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.qhead{background:var(--panel2);padding:13px 16px;font-family:'Saira Condensed',sans-serif;font-size:20px;letter-spacing:2px;
  color:var(--acid);text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.qhead .qn{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:1px}
.qstage{padding:11px 16px;border-bottom:1px solid #21282a;display:flex;gap:14px;flex-wrap:wrap}
.qstage:last-child{border-bottom:none}
.qloc{font-family:'Saira Condensed',sans-serif;letter-spacing:1px;color:var(--gold);min-width:160px;font-size:14px;padding-top:2px}
.qtargets{display:flex;flex-direction:column;gap:4px;flex:1}
.qt{font-size:12px;color:var(--txt);padding-left:16px;position:relative}
.qt::before{content:'›';position:absolute;left:2px;color:var(--acid2)}
.qt .role{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
/* ranks/progress columns */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:780px){.cols{grid-template-columns:1fr}.tagline{display:none}.bignum{font-size:24px}}
h2.sec{font-family:'Saira Condensed',sans-serif;font-size:13px;letter-spacing:3px;color:var(--acid);text-transform:uppercase;margin:8px 0 12px;padding:6px 12px;border-left:2px solid var(--acid);background:var(--panel);border-radius:0 4px 4px 0}
.legend{font-size:11px;color:var(--dim);margin:16px 0;line-height:1.8;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.legend .chip{display:inline-block;margin:0 2px}
.hidden{display:none!important}
/* repair calculator */
.calc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acid);margin:0 0 18px;border-radius:8px;overflow:visible}
.calc-head{background:var(--panel2);padding:12px 16px;font-family:'Saira Condensed',sans-serif;font-size:15px;
  font-weight:600;letter-spacing:1.5px;color:var(--acid);text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0}
.calc-body{padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.calc-field{display:flex;flex-direction:column;gap:6px}
.calc-field label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-family:'Saira Condensed',sans-serif;font-weight:600}
.calc-field .gsel{min-width:220px}
.cinput{background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-family:'Saira Condensed',sans-serif;
  font-size:18px;font-weight:600;padding:7px 12px;width:110px;border-radius:6px}
.cinput:focus{outline:none;border-color:var(--acid);box-shadow:0 0 0 2px rgba(232,184,75,.18)}
.calc-out{margin-left:auto;text-align:right;min-width:200px}
.cbig{font-family:'Saira Condensed',sans-serif;font-size:38px;font-weight:700;color:var(--acid);line-height:1}
.cbig span{font-size:16px;color:var(--dim);font-weight:600}
.csub{font-size:13px;color:var(--txt);margin-top:4px}
.csub.muted{color:var(--dim);font-size:12px}
.csub b{color:var(--acid)}
.cresult.ok{font-size:15px;color:var(--steel);font-family:'Saira Condensed',sans-serif;font-weight:600}
@media(max-width:680px){.calc-body{flex-direction:column;align-items:stretch}.calc-out{margin-left:0;text-align:left}.calc-field .gsel,.cinput{width:100%}}
/* story quests */
.gsel{background:var(--panel);border:1px solid var(--line);color:var(--txt);font-family:'Saira Condensed',sans-serif;font-size:13px;
  padding:8px 13px;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;font-weight:600;border-radius:6px}
.gsel:focus{outline:none;border-color:var(--acid);box-shadow:0 0 0 2px rgba(232,184,75,.15)}
/* custom icon-select */
.gsi-wrap{position:relative;display:inline-block}
.gsi-btn{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-family:'Saira Condensed',sans-serif;font-size:13px;padding:7px 10px 7px 8px;letter-spacing:.4px;font-weight:600;border-radius:6px;cursor:pointer;min-width:180px;user-select:none}
.gsi-btn:hover{border-color:var(--line2);background:var(--panel2)}
.gsi-img{width:28px;height:28px;object-fit:cover;border-radius:3px;flex:none;background:var(--bg2)}
.gsi-ph{display:inline-block;width:28px;height:28px;flex:none}
.gsi-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.gsi-arr{color:var(--dim);font-size:10px;flex:none}
.gsi-list{position:absolute;top:calc(100% + 2px);left:0;min-width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;z-index:500;max-height:280px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.gsi-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;font-family:'Saira Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.4px;border-bottom:1px solid rgba(66,59,44,.3)}
.gsi-opt:last-child{border-bottom:none}
.gsi-opt:hover{background:var(--panel);color:var(--acid)}
.gsi-opt img{width:28px;height:28px;object-fit:cover;border-radius:3px;flex:none;background:var(--bg2)}
@media(max-width:680px){.gsi-btn{min-width:0;width:100%}.gsi-wrap{width:100%}}
/* gear calc slot preview */
.gc-slots{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 14px;border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.gc-slot{display:flex;align-items:center;gap:9px;flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;transition:.15s}
.gc-slot.active{border-color:var(--line2);background:var(--panel2)}
.gc-sph{width:36px;height:36px;border-radius:5px;background:var(--bg2);border:1px dashed var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:15px}
.gc-sico-w{width:36px;height:36px;flex:none}
.gc-sico-w img{width:36px;height:36px;object-fit:cover;border-radius:5px;background:var(--bg2)}
.gc-sinfo{overflow:hidden;min-width:0;display:flex;flex-direction:column;gap:1px}
.gc-stype{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px}
.gc-sname{font-family:'Saira Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-sval{font-size:12px;color:var(--acid);font-weight:700;font-family:'Saira Condensed',sans-serif;letter-spacing:.3px}
/* stat card in calc result */
.gc-statcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 18px;text-align:center;min-width:90px;flex:1}
.gc-statcard.dmg-card{border-color:rgba(255,122,69,.35);background:rgba(255,122,69,.07)}
.gc-statcard.arm-card{border-color:rgba(143,196,168,.35);background:rgba(143,196,168,.07)}
.gc-statcard .bignum{font-size:44px;line-height:1}
/* comparison */
.cmp-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.cmp-hd img{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none;background:var(--bg2)}
.cmp-hd-ph{width:40px;height:40px;border-radius:6px;background:var(--bg2);border:1px dashed var(--line2);flex:none}
.cmp-hd-name{font-family:'Saira Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--txt);line-height:1.2}
.cmp-hd-sub{font-size:11px;color:var(--dim);margin-top:2px}
.cmp-rows{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
.cmp-row{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;border-bottom:1px solid rgba(66,59,44,.3)}
.cmp-row:last-child{border-bottom:none}
.cmp-v{font-family:'Saira Condensed',sans-serif;font-size:20px;font-weight:700;text-align:center;padding:8px 6px}
.cmp-v.win{color:var(--steel)}
.cmp-v.lose{color:var(--dim);font-size:15px;font-weight:400}
.cmp-v.tie{color:var(--txt);font-size:17px}
.cmp-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--acid);text-align:center;padding:2px 4px;font-family:'Saira Condensed',sans-serif;font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line)}
/* transport filter */
.cars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
/* ── Лучший билд для локации ── */
.bb-req{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 6px;align-items:center}
.bb-req-item{font-size:0.88em;background:var(--bg2);padding:3px 9px;border-radius:4px;color:var(--txt)}
.bb-req-stim{font-size:0.82em;font-weight:600;color:#d97706;background:rgba(217,119,6,.15);padding:3px 9px;border-radius:4px;border:1px solid rgba(217,119,6,.4)}
.bb-minbuild{margin:8px 16px 10px;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acid);border-radius:8px;padding:10px 14px}
.bb-minbuild-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:8px;font-family:'Saira Condensed',sans-serif;font-weight:600}
.bb-minbuild-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bb-plus{color:var(--dim);font-size:1.1em;font-weight:700}

<script>
const RARN={1:'Обычное',2:'Редкое',3:'Мистическое',4:'Легендарное',5:'Мифическое'};
const STAT_MAX={
  dmg:Math.max(...DB.weapons.map(w=>parseInt(w.stat)||0)),
  arm:Math.max(...[...DB.armor,...DB.helmets].map(a=>parseInt(a.stat)||0)),
  spd:Math.max(...DB.cars.map(c=>parseInt(c.speed)||0))
};
const $=s=>document.querySelector(s);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return (n||0).toLocaleString('ru-RU');}
function img(k){return (k&&typeof IMG!=='undefined'&&IMG[k])?IMG[k]:'';}

let activeTab=localStorage.getItem('cs_tab')||'gear';
let gearFilter={cat:'weapons',rar:0};
let itemsFilter={transport:0};
let carsFilter={rar:0,cargo:''};
let cmpFilter={type:'weapons',a:'',b:''};
let bestFilter={loc:''};

const TABS=[
  {id:'gear',label:'⚙ Снаряжение'},
  {id:'items',label:'📦 Предметы'},
  {id:'cars',label:'🚗 Транспорт'},
  {id:'story',label:'📋 Задания'},
  {id:'quests',label:'🎯 Контракты'},
  {id:'locations',label:'📍 Локации'},
  {id:'guides',label:'📖 Гайды'},
  {id:'progress',label:'⭐ Прогресс'},
  {id:'terms',label:'📄 Соглашение'},
];
let storyFilter={chap:1,giver:'',opt:false};

function buildTabs(){
  $('#tabs').innerHTML=TABS.map(t=>

}

// ---------- CATALOG (GEAR) ----------
function norm(s){return (s||'').replace(/[«»„""'']/g,'"').replace(/\s+/g,' ').trim().replace(/ё/g,'е').toLowerCase();}

// Белый список расходников (предметы в рюкзак, расходуются). Без динамита.
const CONSUM=new Set(['базовая аптечка','военная аптечка','экспериментальная аптечка',
 'г1','г2','ртд-11','рпог','c4','коктейль молотова','дымовая граната',
 'стимулятор','парацетамин','срочная эвакуация']);

// Агрегируем уникальные предметы из всего лута локаций (единый источник правды)
let _lootCache=null;
function allLootItems(){
  if(_lootCache)return _lootCache;
  const seen=new Map();
  const push=it=>{const k=norm(it.name); if(!seen.has(k))seen.set(k,it);};
  if(DB.locLoot)for(const loc in DB.locLoot){
    const bl=DB.locLoot[loc];
    (bl.rec||[]).forEach(push);
    (bl.loot||[]).forEach(push);
    if(bl.boss&&bl.boss.drop)bl.boss.drop.forEach(push);
  }
  (DB.bags||[]).forEach(push);
  _lootCache=[...seen.values()];
  return _lootCache;
}
// множество имён снаряжения (оружие/броня/шлемы) — чтобы не дублировать в "Предметах"
let _gearNames=null;
function gearNameSet(){
  if(_gearNames)return _gearNames;
  _gearNames=new Set();
  ['weapons','armor','helmets'].forEach(a=>DB[a].forEach(x=>_gearNames.add(norm(x.name))));
  // снаряжение, которое есть только в дропе боссов (не в массивах)
  ['куртка предателя','шапка предателя'].forEach(n=>_gearNames.add(n));
  return _gearNames;
}
function lootCatOf(it){
  const n=norm(it.name);
  if(it.statlbl==='Скорость'||n.indexOf('эвакуатор')>=0)return 'cars';
  if(CONSUM.has(n))return 'consum';
  if(n.indexOf('рюкзак')>=0||n.indexOf('наплечная сумка')>=0)return 'bags';
  if(gearNameSet().has(n))return 'gear';   // снаряжение — в своих вкладках
  return 'items';
}

function gearItems(){
  const c=gearFilter.cat;
  if(c==='weapons')return DB.weapons.map(x=>({...x,kind:'dmg',klbl:'Урон'}));
  if(c==='armor')return DB.armor.map(x=>({...x,kind:'arm',klbl:'Броня'}));
  if(c==='helmets')return DB.helmets.map(x=>({...x,kind:'arm',klbl:'Защита'}));
  // категории из лута локаций
  if(c==='consum'||c==='bags'||c==='items'){
    return allLootItems().filter(it=>lootCatOf(it)===c)
      .map(x=>({...x, rarName:RARN[x.rar]||'', kind: x.statlbl==='Урон'?'dmg':'arm',
               klbl:x.statlbl||'', fromLoot:true}));
  }
  return [];
}

// Собирает комплекты D.I.S.S. из всех массивов снаряжения, сгруппированные по set
function setGroups(){
  const all=[
    ...DB.weapons.map(x=>({...x,kind:'dmg',klbl:'Урон'})),
    ...DB.armor.map(x=>({...x,kind:'arm',klbl:'Защита'})),
    ...DB.helmets.map(x=>({...x,kind:'arm',klbl:'Защита'})),
  ].filter(x=>x.set&&/D\.I\.S\.S/i.test(x.set));
  const groups={};
  all.forEach(x=>{(groups[x.set]=groups[x.set]||[]).push(x);});
  // порядок частей внутри сета: перчатки → бронекостюм → шлем
  const part=n=>/перчатк/i.test(n)?0:/бронекостюм/i.test(n)?1:2;
  Object.values(groups).forEach(g=>g.sort((a,b)=>part(a.name)-part(b.name)));
  // порядок сетов: базовый → Mk2 → Mk3
  const order=Object.keys(groups).sort((a,b)=>{
    const r=v=>v.includes('Mk3')?3:v.includes('Mk2')?2:1; return r(a)-r(b);
  });
  return order.map(name=>({name, rar:groups[name][0].rar, parts:groups[name]}));
}
function gearCard(it){
  const norep=/Не ремонт/i.test(it.mat||'');
  const chips=[];
  chips.push(`<span class="chip rar${it.rar}">${RARN[it.rar]||it.rarName||''}</span>`);
  if(norep)chips.push(`<span class="chip norep">не чинится</span>`);
  if(it.heavy)chips.push(`<span class="chip norep">нужна машина</span>`);
  if(it.craft)chips.push(`<span class="chip craft">крафт ${esc(it.craft.replace(/[()]/g,''))}</span>`);
  if(/[Бб]осс/.test(it.note||''))chips.push(`<span class="chip boss">${esc(it.note)}</span>`);
  if(it.set)chips.push(`<span class="chip set">${esc(it.set)}</span>`);
  let extra='';
  if(it.note && !/[Бб]осс/.test(it.note))extra=`<div class="note">${esc(it.note)}</div>`;
  if(it.desc)extra+=`<div class="note">${esc(it.desc)}</div>`;
  const head=it.icon&&typeof img==='function'&&img(it.icon)
    ? `<div class="cnamerow"><img class="gicon" src="${img(it.icon)}" alt="" loading="lazy"><span class="cname">${esc(it.name)}</span></div>`
    : `<div class="cname">${esc(it.name)}</div>`;
  const _pct=it.stat&&STAT_MAX[it.kind]?Math.round(parseInt(it.stat)/STAT_MAX[it.kind]*100):0;
  const _bar=_pct>0?`<div class="statbar" title="${_pct}%"><div class="statfill ${it.kind}" style="width:${_pct}%"></div></div>`:'';
  const statline = (it.klbl||it.stat)
    ? `<div class="statline"><span class="bignum ${it.kind}">${esc(it.stat)||'—'}</span><span class="statlbl">${esc(it.klbl||'')}</span></div>${_bar}`
    : '';
  return `<div class="card rr${it.rar}" data-name="${esc(it.name.toLowerCase())}">
    ${head}
    ${statline}
    <div class="chips">${chips.join('')}</div>${extra}
  </div>`;
}

function runCmp(){
  const aName=document.getElementById('cmpA')?.value;
  const bName=document.getElementById('cmpB')?.value;
  cmpFilter.a=aName||''; cmpFilter.b=bName||'';
  const out=document.getElementById('cmpOut');
  if(!out)return;
  const arr=DB[cmpFilter.type]||[];
  const a=arr.find(x=>x.name===aName), b=arr.find(x=>x.name===bName);
  if(!a||!b){out.innerHTML='';return;}
  const isWpn=cmpFilter.type==='weapons';
  const statLbl=isWpn?'Урон':'Защита';
  const hd=item=>{
    const src=item.icon?img(item.icon):'';
    return `<div class="cmp-hd">${src?`<img src="${src}" alt="">`:'<div class="cmp-hd-ph"></div>'}<div><div class="cmp-hd-name">${esc(item.name)}</div><div class="cmp-hd-sub">${esc(item.rarName||'')} · ${statLbl} ${item.stat}</div></div></div>`;
  };
  const fields=[
    {lbl:statLbl, av:parseInt(a.stat)||0, bv:parseInt(b.stat)||0, higher:true},
    {lbl:'Редкость', av:a.rar, bv:b.rar, higher:true},
    ...(a.mat!==undefined?[{lbl:'Крафт', av:parseInt(a.mat)||0, bv:parseInt(b.mat)||0, higher:false}]:[]),
  ];
  const rows=fields.map(f=>{
    const aW=f.higher?f.av>f.bv:f.av<f.bv, bW=f.higher?f.bv>f.av:f.bv<f.av;
    const cls=x=>x?'win':(!aW&&!bW)?'tie':'lose';
    return `<div class="cmp-row"><div class="cmp-v ${cls(aW)}">${f.av}${aW?' ↑':''}</div><div class="cmp-lbl">${f.lbl}</div><div class="cmp-v ${cls(bW)}">${f.bv}${bW?' ↑':''}</div></div>`;
  }).join('');
  out.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">${hd(a)}${hd(b)}</div>
    <div class="cmp-rows">${rows}</div>`;

// ── Кастомный дропдаун с иконками ──
function mkIconSel(id, opts, onch) {
  // opts: [{val, label, icon}]  onch: строка JS, вызываемая при выборе
  const icoHtml = k => { const s=k?img(k):''; return s?`<img src="${s}" class="gsi-img" alt="">`:`<span class="gsi-ph"></span>`; };
  const items = opts.map(o => `<div class="gsi-opt" data-val="${esc(o.val)}" data-lbl="${esc(o.label)}" data-ico="${o.icon||''}" onclick="gsiPick('${id}',this);${onch}">${icoHtml(o.icon)}<span>${esc(o.label)}</span></div>`).join('');
  const f = opts[0];
  return `<div class="gsi-wrap" id="${id}_wrap"><input type="hidden" id="${id}" value="${esc(f.val)}"><div class="gsi-btn" onclick="gsiToggle('${id}')"><span class="gsi-ico" id="${id}_ico">${icoHtml(f.icon)}</span><span class="gsi-lbl" id="${id}_lbl">${esc(f.label)}</span><span class="gsi-arr">▾</span></div><div class="gsi-list" id="${id}_list" style="display:none">${items}</div></div>`;
}
function gsiCloseAll() {
  document.querySelectorAll('.gsi-list').forEach(el=>el.style.display='none');
  document.querySelectorAll('.gsi-wrap').forEach(el=>el.style.zIndex='');
}
function gsiToggle(id) {
  const list = document.getElementById(id+'_list');
  if (!list) return;
  const open = list.style.display !== 'none';
  gsiCloseAll();
  if (!open) {
    list.style.display = 'block';
    const wrap = document.getElementById(id+'_wrap');
    if (wrap) wrap.style.zIndex = '9999';
  }
}
function gsiPick(id, el) {
  const val=el.dataset.val, lbl=el.dataset.lbl, ico=el.dataset.ico;
  const h=document.getElementById(id); if(h) h.value=val;
  const lb=document.getElementById(id+'_lbl'); if(lb) lb.textContent=lbl;
  const s=ico?img(ico):'';
  const ie=document.getElementById(id+'_ico'); if(ie) ie.innerHTML=s?`<img src="${s}" class="gsi-img" alt="">`:`<span class="gsi-ph"></span>`;
  gsiCloseAll();
}
document.addEventListener('click', e=>{ if(!e.target.closest('.gsi-wrap')) gsiCloseAll(); });

function gcSlotUpdate(sfx, item, typeStat) {
  const icoEl=document.getElementById('gcSico_'+sfx);
  const nameEl=document.getElementById('gcSname_'+sfx);
  const valEl=document.getElementById('gcSval_'+sfx);
  const slotEl=document.getElementById('gcSlot_'+sfx);
  if(!icoEl)return;
  if(item){
    const src=item.icon?img(item.icon):'';
    icoEl.innerHTML=src?`<img src="${src}" style="width:36px;height:36px;object-fit:cover;border-radius:5px;background:var(--bg2)">`:'<div class="gc-sph" style="font-size:15px">'+(sfx==='w'?'⚔':sfx==='a'?'🛡':'⛑')+'</div>';
    if(nameEl)nameEl.textContent=item.name;
    if(valEl)valEl.textContent=item.stat+' '+typeStat;
    if(slotEl)slotEl.classList.add('active');
  } else {
    icoEl.innerHTML='<div class="gc-sph" style="font-size:15px">'+(sfx==='w'?'⚔':sfx==='a'?'🛡':'⛑')+'</div>';
    if(nameEl)nameEl.textContent='не выбрано';
    if(valEl)valEl.textContent='';
    if(slotEl)slotEl.classList.remove('active');
  }
}
function runGearCalc(){
  const wName=document.getElementById('gcWpn')?.value;
  const aName=document.getElementById('gcArm')?.value;
  const hName=document.getElementById('gcHlm')?.value;
  const conBonus=parseInt(document.getElementById('gcCon')?.value)||0;
  const w=DB.weapons.find(x=>x.name===wName);
  const a=DB.armor.find(x=>x.name===aName);
  const h=DB.helmets.find(x=>x.name===hName);
  gcSlotUpdate('w',w,'ур.');
  gcSlotUpdate('a',a,'зщ.');
  gcSlotUpdate('h',h,'зщ.');
  const atk=(parseInt(w?.stat)||0)+conBonus;
  const armor=(parseInt(a?.stat)||0)+(parseInt(h?.stat)||0);
  const def=armor+100;
  const out=document.getElementById('gcResult');
  if(!out)return;
  if(!w&&!a&&!h&&!conBonus){out.innerHTML='';return;}
  const locRows=DB.locations.map(l=>{
    const la=parseInt(l.atk)||0;
    const ld=parseInt((l.def||'').match(/^(\d+)/)?.[1])||0;
    const okAtk=atk>=la, okDef=def>=ld;
    const ok=okAtk&&okDef;
    const miss=[];
    if(!okAtk)miss.push(`атака: нужно <b>${la}</b>, есть ${atk}`);
    if(!okDef)miss.push(`защита: нужно <b>${ld}</b>, есть ${def}`);
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px">
      <span style="font-size:14px;flex:none">${ok?'✅':'❌'}</span>
      <span style="font-family:'Saira Condensed',sans-serif;font-weight:600;color:var(--txt);flex:1;min-width:0">${esc(l.name)}</span>
      <span style="font-size:12px;text-align:right">${ok?`<span class="safe">подходит</span>`:miss.map(m=>`<span class="danger">${m}</span>`).join(' · ')}</span>
    </div>`;
  }).join('');
  out.innerHTML=`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px">
      <div class="gc-statcard dmg-card"><div class="bignum dmg">${atk}</div><div class="statlbl">атака</div>${conBonus?`<div style="font-size:10px;color:var(--dim);margin-top:2px">расходник +${conBonus}</div>`:''}</div>
      <div class="gc-statcard arm-card"><div class="bignum arm">${def}</div><div class="statlbl">защита</div><div style="font-size:10px;color:var(--dim);margin-top:2px">броня ${armor} + 100 HP</div></div>
    </div>
    <div style="border-top:1px solid var(--line);padding-top:10px">${locRows}</div>`;
}

      <div class="calc-field">
        <label>Текущая прочность, %</label>

    &nbsp;•&nbsp; Тип груза: 🚛 эвакуатор возит машины · ▣ большие грузы · ▪ малые грузы · — не возит ничего
  </div>`;

function runCalc(){
  const car=DB.cars.find(c=>c.name===document.getElementById('calcCar').value);
  if(!car){return;}
  let cur=parseFloat(document.getElementById('calcCur').value);
  if(isNaN(cur))cur=0;
  cur=Math.max(0,Math.min(100,cur));
  const per=parseFloat(car.repCost)||0;
  const diff=Math.max(0,100-cur);
  const total=Math.round(diff*per);
  const out=document.getElementById('calcOut');
  const spp=car.spp?parseFloat(car.spp):0;
  let raidsLine='';
  if(spp>0){
    const full=Math.floor(100/spp);
    const now=Math.floor(cur/spp);
    raidsLine=`<div class="csub muted">Хватает на <b>${full}</b> рейд(ов) со 100% · сейчас осталось <b>${now}</b> (теряет ~${esc(car.spp)}% за рейд)</div>`;
  }
  if(diff<=0){
    out.innerHTML=`<div class="cresult ok">Чинить не нужно — прочность 100%.</div>${raidsLine}`;
    return;
  }
  out.innerHTML=`
    <div class="cbig">${fmt(total)} <span>мат.</span></div>
    <div class="csub">восстановить <b>${diff}%</b> × ${per} мат = <b>${fmt(total)}</b> материалов</div>
    ${raidsLine}`;
}

  if(storyFilter.giver)list=list.filter(q=>q.giver===storyFilter.giver);
  if(storyFilter.opt)list=list.filter(q=>q.optional);
  const ch1n=all.filter(q=>q.chap===1).length, ch2n=all.filter(q=>q.chap===2).length, ch3n=all.filter(q=>q.chap===3).length;
  const chapLabel={1:'Глава 1',2:'Глава 2',3:'Глава 3'};
  const chapDesc={
    1:'Начало игры — первые задания и разблокировка базовых механик.',
    2:'Середина сюжета — организации, рынок, расследования.',
    3:'Финал — восток и развязка истории.'
  };
  function qCard(q){
    const chips=[];
    if(q.optional)chips.push(`<span class="chip opt">необязательный</span>`);
    if(q.unlock)chips.push(`<span class="chip unlock">★ ${esc(q.unlock)}</span>`);
    const face=q.face?`<img class="qface" src="${img(q.face)}" alt="">`:`<div class="qface ph">?</div>`;
    const icon=q.icon?`<img class="qicon" src="${img(q.icon)}" alt="">`:'';
    const rew=q.reward?`<div class="qrew"><span class="ql">Награда</span> ${esc(q.reward)}</div>`:`<div class="qrew muted"><span class="ql">Награда</span> —</div>`;
    const note=q.note?`<div class="qnote">${esc(q.note)}</div>`:'';
    return `<div class="qcard ${q.optional?'isopt':''}" data-name="${esc((q.title+' '+q.giver+' '+q.req+' '+q.reward).toLowerCase())}">
      <div class="qleft">
        ${face}
        <div class="qgiver">${esc(q.giver)||'—'}</div>
      </div>
      <div class="qbody">
        <div class="qtitle">${esc(q.title)}</div>
        <div class="qreq">${icon}<div><span class="ql">Сдать</span> ${esc(q.req)||'—'}</div></div>
        ${rew}
        <div class="chips">${chips.join('')}</div>
        ${note}
      </div>
    </div>`;
  }
  // Group by chapter, render chapter blocks
  let html='';
  for(const chap of [1,2,3]){
    const chapList=list.filter(q=>q.chap===chap);
    if(!chapList.length)continue;
    const isIncomp=chap===3&&!storyFilter.giver&&!storyFilter.opt;
    html+=`<div class="q-chapter">
      <div class="q-chap-hd">
        <span class="q-chap-title">${chapLabel[chap]}</span>
        <span class="q-chap-cnt">${chapList.length} квест(ов)</span>
      </div>
      ${isIncomp?`<div class="gp gwarn" style="margin:0 0 10px;font-size:12px">⚠ Глава 3 ещё не завершена — квесты будут добавляться.</div>`:''}
      <div class="qgrid">${chapList.map(qCard).join('')}</div>
    </div>`;
  }
  if(!html)html=`<div class="intro muted">Квесты не найдены</div>`;
  return `
  <div class="intro">Основная цепочка заданий по главам. <b>Сдать</b> — что нужно принести квестодателю, <b>Награда</b> — что получишь. Звёздочкой ★ отмечены квесты, открывающие важные механики (рынок, лагерь, организация).</div>
  <div class="bar">
    <select class="gsel" onchange="setStoryGiver(this.value)">
      <option value="">Все квестодатели</option>
      ${givers.map(g=>`<option value="${esc(g)}" ${storyFilter.giver===g?'selected':''}>${esc(g)}</option>`).join('')}
    </select>
    <button class="filter ${storyFilter.opt?'on':''}" onclick="toggleStoryOpt()">Необязательные</button>
    <span class="cnt">${list.length} заданий</span>
  </div>
  ${html}`;
}
function setStoryChap(c){storyFilter.chap=c;render();}
function setStoryGiver(g){storyFilter.giver=g;render();}
function toggleStoryOpt(){storyFilter.opt=!storyFilter.opt;render();}

// ---------- GUIDES ----------
function renderGuides(){
  const gi=DB.guides[0].images;
  const rec=img(gi.rec),rifle=img(gi.rifle),helmet=img(gi.helmet),armor=img(gi.armor),creator=img(gi.creator);
  return `
  <div class="guide-doc" data-name="как ходить по локациям экипировка урон броня атака">
    <div class="ghdr">
      <div class="gtag">ГАЙД</div>
      <h2 class="gtitle">Как правильно ходить по локациям</h2>
      <div class="gsub">База: как читать экипировку и за что отвечают урон, броня и атака</div>
    </div>

    <p class="gp">Сегодня затрагиваем базу — как правильно ходить по локациям Кастовска. Запоминаем <b>два правила</b>:</p>
    <div class="grules">
      <div class="grule"><span class="grn">1</span> Отправляем бойцов с <b>не менее 100 HP</b>.</div>
      <div class="grule"><span class="grn">2</span> Следим за <b>рекомендованной экипировкой</b> локации.</div>
    </div>
    <p class="gp gwarn">Если отправили в Кварталы или Центр Кастовска с неполным HP, ВПК и стартовой бронёй — не удивляемся, что боец оттуда не вернулся.</p>

    <h3 class="gh">Учимся читать рекомендуемую экипировку</h3>
    <div class="gimg"><img src="${rec}" alt="Рекомендуемое снаряжение"></div>
    <p class="gp">Эта панель означает три требования:</p>
    <div class="gspecs">
      <div class="gspec"><div class="gsn">100</div><div class="gsl">аптечка<br><span>минимум HP</span></div></div>
      <div class="gspec"><div class="gsn">144</div><div class="gsl">винтовка<br><span>минимум урона</span></div></div>
      <div class="gspec"><div class="gsn">25</div><div class="gsl">шлем + броня<br><span>минимум брони</span></div></div>
    </div>
    <div class="grow2">
      <div class="gimg sm"><img src="${rifle}" alt="Винтовка СВП"></div>
      <div class="gimg sm"><img src="${helmet}" alt="Шлем пилота"></div>
      <div class="gimg sm"><img src="${armor}" alt="Байкал 2"></div>
    </div>
    <p class="gp gwarn">Локации коварные: с экипировкой ниже рекомендованной обычно прилетает 30–40 урона, но однажды боец может словить <b>&gt;100 урона</b> и не вернуться.</p>
    <p class="gp">В рюкзаки кладём <b>гранаты и стимуляторы</b> — расходники повышают атаку и броню. Не пренебрегаем ими: если экипировки не хватает, ими можно догнать до нужных показателей. Но они не навсегда — теряются в бою, если показателей не хватило.</p>

    <h3 class="gh">За что отвечают урон, броня и атака</h3>
    <div class="gcards">
      <div class="gmech">
        <div class="gmh">Урон локации</div>
        <p>Считается по рекомендованной экипировке. Если указана аптечка 150 и броня+шлем на 90 — то <b>100% урона локации ≈ 240</b>. Но это не потолок: локация может выдать и больше (см. «Атака»).</p>
        <div class="gformula">аптечка + (броня + шлем) ≈ 100% урона</div>
      </div>
      <div class="gmech">
        <div class="gmh">Броня</div>
        <p>Это <b>дополнительное здоровье</b>: 100 HP + 25 брони = фактически 125 HP. Но броня принимает <b>не весь</b> урон — 300 брони не значит, что 250 урона пройдут бесследно. Если боец вернулся с 1 HP — его вытянула только броня, больше так не отправляй, приодень бедолагу. Броню добивает <b>стимулятор</b> (тратится, если брони не хватило).</p>
      </div>
      <div class="gmech">
        <div class="gmh">Атака</div>
        <p>Показатель оружия. У каждой локации своё требование. Если в заметках лесника оружие на 144 и граната на 21 — снаряжаемся <b>хотя бы на 165 атаки</b>.</p>
        <div class="gsplit">
          <div class="gok"><b>Требование соблюдено</b> → урон не выше 100% (обычно 0–30%)</div>
          <div class="gbad"><b>Не соблюдено</b> → локация бьёт сверх 100% (30–120%)</div>
        </div>
      </div>
    </div>

    <h3 class="gh">…ну или как сказал сам создатель игры</h3>
    <div class="gimg quote"><img src="${creator}" alt="Сообщение создателя"></div>
  </div>`;
}

  </tr>`).join('');

function render(){
  const m=$('#main');
  if(activeTab==='terms')m.innerHTML=`<section class="on">${renderTerms()}</section>`;
  else if(activeTab==='gear'){m.innerHTML=`<section class="on">${renderGear()}</section>`;runGearCalc();}
  else if(activeTab==='items')m.innerHTML=`<section class="on">${renderItems()}</section>`;
  else if(activeTab==='story')m.innerHTML=`<section class="on">${renderStory()}</section>`;
  else if(activeTab==='cars'){m.innerHTML=`<section class="on">${renderCars()}</section>`;runCalc();}
  else if(activeTab==='locations')m.innerHTML=`<section class="on">${renderLocations()}</section>`;
  else if(activeTab==='quests')m.innerHTML=`<section class="on">${renderQuests()}</section>`;
  else if(activeTab==='guides')m.innerHTML=`<section class="on">${renderGuides()}</section>`;
  else if(activeTab==='progress')m.innerHTML=`<section class="on">${renderProgress()}</section>`;
  const gs=$('#globalSearch').value.trim();
  if(gs)globalSearch(gs);
}

// ---------- GLOBAL SEARCH ----------
function globalSearch(q){
  q=q.trim().toLowerCase();
  const nodes=document.querySelectorAll('[data-name]');
  if(!q){nodes.forEach(n=>n.classList.remove('hidden'));return;}
  nodes.forEach(n=>{
    n.classList.toggle('hidden',!n.dataset.name.includes(q));
  });
}

buildTabs();render();
window.addEventListener('scroll',()=>{
  const b=document.getElementById('toTop');
  if(b)b.classList.toggle('show',window.scrollY>400);
});
</script>
